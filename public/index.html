<style>
:root{--bg:#FFF8FA;--surface:#fff;--ink:#3B1F2C;--muted:#85606F;--brand:#B02A62;--brand-ink:#fff;--soft:#FBE3EB;--line:#F2C9D8;--bar:#fff;--ok:#1F7A4D;--err:#B3261E;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1217;--surface:#291A22;--ink:#F8E8EF;--muted:#C9A3B3;--brand:#E0568C;--brand-ink:#25101A;--soft:#35212B;--line:#4A2E3B;--bar:#1D1217;--ok:#6FD3A1;--err:#FF9A92}}
:root[data-theme="dark"]{--bg:#1D1217;--surface:#291A22;--ink:#F8E8EF;--muted:#C9A3B3;--brand:#E0568C;--brand-ink:#25101A;--soft:#35212B;--line:#4A2E3B;--bar:#1D1217;--ok:#6FD3A1;--err:#FF9A92}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
body.lock{overflow:hidden}
h1,h2,h3,.logo{font-family:"Cormorant Garamond","Amiri",Georgia,serif;margin:0;font-weight:700;line-height:1.15}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bar);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 14px;gap:8px}
.logo{font-size:28px;letter-spacing:.14em;color:var(--brand);text-align:center;line-height:1}
.logo small{display:block;font-size:12px;letter-spacing:.06em;font-style:italic;font-weight:600;color:var(--muted);margin-top:2px}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:2px;justify-self:start}
.langs button{border:0;background:none;padding:4px 12px;border-radius:99px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.icons{justify-self:end;display:flex;gap:8px}.ig{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--brand);border:1px solid var(--line)}
.ig svg{width:22px;height:22px}
.strip{background:var(--brand);color:var(--brand-ink);text-align:center;padding:6px 12px;font-size:14px;font-weight:500}
.hero{padding:24px 20px 20px;text-align:center;background:linear-gradient(var(--soft),var(--bg));border-bottom:6px solid var(--soft)}
.hero h1{font-size:clamp(44px,13vw,76px);color:var(--brand);letter-spacing:.01em}
.hero p{max-width:34ch;margin:8px auto 0;color:var(--muted)}
.btn{display:inline-block;border:0;background:var(--brand);color:var(--brand-ink);padding:12px 26px;border-radius:99px;font-weight:700;cursor:pointer;min-height:44px}
.btn:active{transform:scale(.98)}
.wrap{max-width:960px;margin:0 auto;padding:36px 16px 0}
h2{font-size:34px;color:var(--brand);margin-bottom:18px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:700px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/5;display:grid;place-items:center;position:relative;color:var(--brand)}.ph svg{width:60px;height:60px;opacity:.5}.ph img{width:100%;height:100%;object-fit:cover}.sum .em{color:var(--brand)}.sum .em svg{width:28px;height:28px;opacity:.6}.band{text-align:center;padding:30px 24px;margin-top:36px;background:var(--soft)}.band p{font-family:"Cormorant Garamond","Amiri",Georgia,serif;font-size:26px;font-weight:700;color:var(--brand);max-width:24ch;margin:0 auto;line-height:1.35}
.badge{position:absolute;top:8px;inset-inline-start:8px;background:var(--brand);color:var(--brand-ink);font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.badge.out{background:var(--muted)}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{font-size:19px;font-weight:700}
.price{font-weight:700;color:var(--brand)}
.info .btn{margin-top:auto;padding:6px 10px;font-size:14px;min-height:36px;width:100%}
.btn[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.steps b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-family:"Cormorant Garamond",serif;font-size:20px}
.visit{background:var(--soft);border-radius:20px;padding:22px 18px;text-align:center}
.visit p{margin:0 0 14px}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
summary{cursor:pointer;font-weight:700}
details p{margin:8px 0 0;color:var(--muted)}
footer{margin-top:40px;padding:22px 16px 30px;text-align:center;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
footer a{color:var(--brand);font-weight:700}
.back{position:fixed;inset:0;background:rgba(40,10,25,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.back.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}html{scroll-behavior:auto}}
.sh-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:10px}
.sh-head h2{font-size:26px;margin:0}
.x{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:20px;flex:none}
.sum{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
.sum .em{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-size:32px;flex:none}
.qty{display:inline-flex;align-items:center;gap:10px;margin-inline-start:auto}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
label{display:block;font-weight:500;margin:10px 0 4px}
input[type=text],input[type=tel]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:44px}
.opt{display:flex;gap:8px;margin-top:4px}
.opt label{flex:1;margin:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-size:14px}
.opt input{position:absolute;opacity:0}
.opt label:has(input:checked){border-color:var(--brand);background:var(--soft);font-weight:700}
.opt label:has(input:focus-visible){outline:3px solid var(--brand)}
.err{color:var(--err);font-size:13px;min-height:0;margin:2px 0 0}
.tot{display:flex;justify-content:space-between;font-weight:700;margin:14px 0 4px;font-size:18px}
.note{font-size:13px;color:var(--muted);margin:0 0 12px}
.done{text-align:center;padding:10px 0}
.done .tick{font-size:48px;color:var(--ok)}
.demo{font-size:12px;color:var(--muted);margin-top:12px}
.revs{padding:36px 0 0}.revs h2{padding:0 16px}.rv{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 8px;scrollbar-width:none}.rv::-webkit-scrollbar{display:none}.rc{flex:0 0 78%;max-width:320px;scroll-snap-align:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}.rc .rp{aspect-ratio:1/1;display:grid;place-items:center;color:var(--brand)}.rc .rp svg{width:44px;height:44px;opacity:.5}.rc .rp img{width:100%;height:100%;object-fit:cover}.rc p{margin:0;padding:12px 14px 4px}.rc small{display:block;padding:0 14px 12px;color:var(--muted)}
[hidden]{display:none!important}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}.gs{flex:0 0 100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:center;display:grid;place-items:center;color:var(--brand);border-radius:16px}.gs svg{width:72px;height:72px;opacity:.5}.dd{color:var(--muted);margin:6px 0 12px}.og{margin:10px 0}.og b{display:block;margin-bottom:6px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{margin:0;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:500}.chips input{position:absolute;opacity:0}.chips label:has(input:checked){border-color:var(--brand);background:var(--soft);font-weight:700}.chips label:has(input:focus-visible){outline:3px solid var(--brand)}
</style>

var COLORS=["#F9D6E1","#FBE3D6","#FFF0C9","#E6F2D5","#DCEBFA","#EBDDF7"];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function img(u,w){u=String(u||"");return /^https:\/\/res\.cloudinary\.com\//.test(u)?u.replace("/upload/","/upload/f_auto,q_auto,w_"+w+"/"):""}
function api(path,opt){opt=opt||{};if(opt.body){opt.method="POST";opt.headers={"Content-Type":"application/json"};opt.body=JSON.stringify(opt.body)}return fetch(path,opt).then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})})}
function ev(type,pid){api("/api/event",{body:{type:type,product_id:pid||null}}).catch(function(){})}
function norm(p){return {id:p.id,ar:p.name_ar,fr:p.name_fr||p.name_ar,da:p.desc_ar,df:p.desc_fr,price:p.price,badge:p.badge||"",c:COLORS[p.id%COLORS.length],
  imgs:(p.images||[]).filter(function(u){return img(u,1)}),opts:(p.opts||[]).map(function(o){return {ar:o.ar,fr:o.fr||o.ar,v:o.v||[],vf:o.vf&&o.vf.length?o.vf:o.v||[]}})}}
var sel={};
function optText(){return (cur&&cur.opts||[]).map(function(o,i){return sel[i]!=null?(L==="ar"?o.ar:o.fr)+": "+(L==="ar"?o.v:o.vf)[sel[i]]:""}).filter(Boolean).join(" · ")}
try{L=localStorage.getItem("lang")==="fr"?"fr":"ar"}catch(e){}
var $=function(id){return document.getElementById(id)};
function t(k){return T[L][k]}
function money(n){return "\u2066"+String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")+"\u2069 "+t("cur")}
function grid(){
  var cards=PRODUCTS.map(function(p){
    var b=p.badge?'<span class="badge'+(p.badge==="out"?" out":"")+'">'+t(p.badge)+"</span>":"";
    return '<article class="card"><div class="ph" style="background:'+p.c+'" aria-hidden="true">'+(p.imgs[0]?'<img src="'+esc(img(p.imgs[0],500))+'" alt="" loading="lazy">':ICON)+b+'</div><div class="info" dir="'+DIR()+'"><h3>'+esc(p[L])+'</h3><div class="price">'+money(p.price)+'</div><button class="btn" type="button" data-id="'+p.id+'"'+(p.badge==="out"?" disabled":"")+">"+(p.badge==="out"?t("out"):t("see"))+"</button></div></article>"});
  $("g1").innerHTML=cards.slice(0,2).join("");$("g2").innerHTML=cards.slice(2,6).join("");$("g3").innerHTML=cards.slice(6).join("");
}
function sheet(){
  if(!cur)return;
  $("sName").textContent=cur[L];$("sPrice").textContent=money(cur.price);$("sEm").innerHTML=ICON;$("sName").dir=DIR();$("sOpt").textContent=optText();$("sEm").style.background=cur.c;
  $("q").textContent=qty;$("tot").textContent=money(cur.price*qty);
}
function setLang(l){
  L=l;try{localStorage.setItem("lang",l)}catch(e){}
  document.documentElement.lang=l;
  document.querySelectorAll("[data-t]").forEach(function(el){el.innerHTML=t(el.dataset.t);el.dir=DIR()});
  document.querySelectorAll("input[type=text],input[type=tel]").forEach(function(i){i.dir="auto"});
  document.querySelectorAll(".langs button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.l===l))});
  $("ph").placeholder="05 XX XX XX XX";grid();sheet();if(cur&&!$("detView").hidden)detail();
}
function open(id,btn){
  cur=PRODUCTS.filter(function(p){return p.id===id})[0];qty=1;lastBtn=btn;
  sel={};ev("product_view",id);detail();$("back").classList.add("on");document.body.classList.add("lock");$("close2").focus();
}
function goOrder(){
  $("f").reset();["eNm","ePh","eWl","eAd"].forEach(function(i){$(i).textContent=""});
  $("adWrap").hidden=false;$("detView").hidden=true;$("formView").hidden=false;$("doneView").hidden=true;
  sheet();$("nm").focus();
}
function detail(){
  var p=cur;$("formView").hidden=true;$("doneView").hidden=true;$("detView").hidden=false;$("dErr").textContent="";
  $("dT").textContent=p[L];$("dPrice").textContent=money(p.price);
  $("dDesc").textContent=(L==="ar"?p.da:p.df)||t("dNone");$("dDesc").dir=DIR();
  $("gal").innerHTML=(p.imgs&&p.imgs.length?p.imgs:[0,1,2]).map(function(s){return typeof s==="string"?'<img class="gs" src="'+esc(img(s,900))+'" alt="">':'<div class="gs" style="background:'+p.c+'">'+ICON+'</div>'}).join("");
  $("dOpts").innerHTML=(p.opts||[]).map(function(o,i){var vs=L==="ar"?o.v:o.vf;return '<div class="og" dir="'+DIR()+'"><b>'+esc(L==="ar"?o.ar:o.fr)+'</b><div class="chips">'+vs.map(function(v,j){return '<label><input type="radio" name="o'+i+'" value="'+j+'"'+(sel[i]===j?" checked":"")+'><span>'+esc(v)+'</span></label>'}).join("")+'</div></div>'}).join("");
}
function close(){$("back").classList.remove("on");document.body.classList.remove("lock");if(lastBtn)lastBtn.focus()}
document.querySelectorAll(".langs button").forEach(function(b){b.addEventListener("click",function(){setLang(b.dataset.l)})});

document.querySelector("main").addEventListener("click",function(e){var b=e.target.closest("button[data-id]");if(b&&!b.disabled)open(+b.dataset.id,b)});
$("close").addEventListener("click",close);$("close2").addEventListener("click",close);$("again").addEventListener("click",close);
$("dOpts").addEventListener("change",function(e){if(e.target.name)sel[+e.target.name.slice(1)]=+e.target.value});
$("toOrder").addEventListener("click",function(){var miss=(cur.opts||[]).some(function(o,i){return sel[i]==null});if(miss){$("dErr").textContent=t("pick");return}goOrder()});
$("back").addEventListener("click",function(e){if(e.target===$("back"))close()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("back").classList.contains("on"))close()});
$("minus").addEventListener("click",function(){if(qty>1){qty--;sheet()}});
$("plus").addEventListener("click",function(){if(qty<10){qty++;sheet()}});
document.querySelectorAll("input[name=dl]").forEach(function(r){r.addEventListener("change",function(){$("adWrap").hidden=r.value==="desk"&&r.checked})});
$("f").addEventListener("submit",function(e){
  e.preventDefault();
  var nm=$("nm").value.trim(),ph=$("ph").value.replace(/[\s.-]/g,""),wl=$("wl").value.trim(),ad=$("ad").value.trim();
  var home=document.querySelector("input[name=dl]:checked").value==="home";
  var bad=[[nm.length<3,"eNm","nm"],[!/^0[567]\d{8}$/.test(ph),"ePh","ph"],[!wl,"eWl","wl"],[home&&!ad,"eAd","ad"]];
  var first=null;
  bad.forEach(function(r){$(r[1]).textContent=r[0]?t(r[1]):"";if(r[0]&&!first)first=r[2]});
  if(first){$(first).focus();return}
  var sb=e.submitter||$("f").querySelector("[type=submit]");sb.disabled=true;$("eSub").textContent="";
  api("/api/orders",{body:{product_id:cur.id,qty:qty,options:optText(),name:nm,phone:ph,wilaya:wl,commune:$("cm").value.trim(),delivery:home?"home":"desk",address:ad}}).then(function(){
  $("okMsg").textContent=t("okMsg").replace("{n}",nm).replace("{p}",ph);
  $("okSum").textContent=cur[L]+" × "+qty+" = "+money(cur.price*qty)+(optText()?" ("+optText()+")":"");
  $("formView").hidden=true;$("doneView").hidden=false;
  }).catch(function(){$("eSub").textContent=t("eNet")}).then(function(){sb.disabled=false});
});
var REVIEWS=[];
function reviews(){
  document.querySelector(".revs").hidden=!REVIEWS.length;
  $("rv").innerHTML=REVIEWS.map(function(r,i){var u=r.image_url&&img(r.image_url,600),tx=L==="ar"?r.text_ar:(r.text_fr||r.text_ar);
    return '<article class="rc" dir="'+DIR()+'"><div class="rp" style="background:'+COLORS[i%COLORS.length]+'">'+(u?'<img src="'+esc(u)+'" alt="" loading="lazy">':ICON)+'</div><p>'+esc(tx)+'</p><small>'+esc(r.who||"")+'</small></article>'}).join("");
}
(function(){
  var el=$("rv"),paused=false,mq=window.matchMedia("(prefers-reduced-motion:reduce)");
  ["pointerdown","focusin","mouseenter"].forEach(function(n){el.addEventListener(n,function(){paused=true})});
  ["pointerup","pointercancel","touchend","focusout","mouseleave"].forEach(function(n){el.addEventListener(n,function(){setTimeout(function(){paused=false},2500)})});
  setInterval(function(){
    if(paused||mq.matches||document.hidden)return;
    var c=el.firstElementChild;if(!c)return;
    if(el.scrollLeft+el.clientWidth>=el.scrollWidth-4)el.scrollTo({left:0,behavior:"smooth"});else el.scrollBy({left:c.offsetWidth+12,behavior:"smooth"});
  },3500);
})();
setLang(L);
function msg(k){return '<p class="note" style="grid-column:1/-1;text-align:center">'+t(k)+'</p>'}
function load(){
  $("g1").innerHTML=msg("loading");
  api("/api/products").then(function(r){PRODUCTS=r.map(norm);grid()}).catch(function(){$("g1").innerHTML=msg("loadErr")});
  api("/api/reviews").then(function(r){REVIEWS=r;reviews()}).catch(function(){});
  try{if(!sessionStorage.getItem("v")){sessionStorage.setItem("v","1");ev("visit")}}catch(e){}
}
document.addEventListener("click",function(e){var a=e.target.closest("a[href]");if(!a)return;var h=a.getAttribute("href");if(h.indexOf("instagram.com")>-1)ev("ig_click");else if(h.indexOf("tel:")===0)ev("call_click")});
load();
</script>
</body>
</html>
